name: "GHA - FE LIB APP typecheck"
run-name: "Typecheck Frontend Lib App"
on: [pull_request, workflow_dispatch]

jobs:
  frontendLibAppTypecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Volta
        run: |
          curl https://get.volta.sh | bash
          echo "$HOME/.volta/bin" >> $GITHUB_PATH

      - name: Install packages
        run: |
          volta install node yarn
          yarn install --immutable
        working-directory: ./src-frontend-app-web

      - name: Generate DALInfo
        run: bash ./generate-dalinfo-ts.sh

      - name: Run typecheck
        run: yarn gha:typecheck
        working-directory: ./src-frontend-app-web
